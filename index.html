<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Five²">
  <title>Five²</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f1ea;
      --text: #1e1f22;
      --muted: #65676b;
      --tile: #fffdf8;
      --tile-border: #b6b0a6;
      --ended: #c9c9c9;
      --ended-border: #8b8b8b;
      --button: #1e1f22;
      --button-text: #ffffff;
      --secondary: #ebe7df;
      --secondary-border: #b8b1a7;
      --focus: #5b7cfa;
    }

    * { box-sizing: border-box; }

    html, body {
    font-family: "Trebuchet MS", Arial, sans-serif;
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      display: flex;
      justify-content: center;
    }

    main {
      width: min(720px, 100%);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
    }

    main > header, main > .controls { width: 80%; margin-inline: auto; }
    main[data-expanded="true"] > header, main[data-expanded="true"] > .controls { width: 100%; }

    .brand {
      justify-self: start;
      font-size: clamp(2rem, 7vw, 3.4rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 0.95;
    }

    .timer-wrap {
      text-align: right;
      min-width: 7.25rem;
      text-align: center;
    }

    .header-tools { justify-self: end; display: flex; align-items: flex-end; width: 48px; height: 48px; }

    #timer {
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.1rem, 8vw, 3.3rem);
      font-weight: 750;
      line-height: 1;
    }

    #status {
      margin-top: 0;
      min-height: 1.2em;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 600;
    }

    #status.time-up {
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 800;
    }

    #board {
      display: grid;
      position: relative;
      grid-template-columns: repeat(5, 1fr);
      gap: clamp(6px, 1.6vw, 12px);
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .tile {
    position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      aspect-ratio: 1 / 1;
      border: 2px solid var(--tile-border);
      border-radius: clamp(10px, 2.5vw, 18px);
      background: var(--tile);
      color: var(--text);
      font-size: clamp(2rem, 10.5vw, 5rem);
      font-weight: 800;
      line-height: 1;
      text-transform: uppercase;
      user-select: none;
      transition: background-color 180ms ease, border-color 180ms ease;
    }

    .tile.qu {
      font-size: clamp(1.55rem, 8vw, 3.8rem);
      text-transform: none;
    }

    #board.ended .tile {
      background: var(--ended);
      border-color: var(--ended-border);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      appearance: none;
      -webkit-appearance: none;
      min-height: 50px;
      border-radius: 12px;
      border: 1px solid transparent;
      font: inherit;
      font-size: 1rem;
      font-weight: 750;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    button.primary {
      background: var(--button);
      color: var(--button-text);
    }

    button.secondary {
      background: var(--secondary);
      color: var(--text);
      border-color: var(--secondary-border);
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .note {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.4;
      text-align: center;
    }

    @media (max-width: 430px) {
      body { padding-left: 12px; padding-right: 12px; }
      .controls { grid-template-columns: 1fr; }
      header { align-items: center; }
      .timer-wrap { text-align: left; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191a1d;
        --text: #f3f3f1;
        --muted: #b6b6b0;
        --tile: #292b2f;
        --tile-border: #666970;
        --ended: #4a4b4f;
        --ended-border: #7b7d82;
        --button: #f0eee9;
        --button-text: #1b1c1f;
        --secondary: #2c2e32;
        --secondary-border: #62656b;
      }
    }
  
  .tile-letter {
    font-family: "Trebuchet MS", Arial, sans-serif;
    font-weight: 700;
    position: absolute;
    left: 50%;
    top: 50%;
    line-height: 1;
    transform: translate(-50%, -50%) rotate(var(--rotation, 0deg));
    transform-origin: center center;
    white-space: nowrap;
  }

    .board-wrap { position: relative; width: 100%; margin: 0 auto; }
    @media (min-width: 600px) { .board-wrap { width: 80%; } }
    .board-wrap[data-expanded="true"] { width: 100%; }
    .board-wrap[data-expanded="false"] { width: 80%; }
    #board-size { min-width: 48px; min-height: 48px; padding: 0; font-size: 1.4rem; line-height: 1; background: transparent; border-color: transparent; color: var(--text); }
    #board-size:hover { background: transparent; border-color: transparent; }
    #board-size svg { width: 1.35em; height: 1.35em; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    @media (max-width: 599px) {
      main > header, main > .controls { width: 100%; }
      header { text-align: center; }
    }
    #countdown {
      position: absolute; left: 40%; top: 40%; width: 20%; height: 20%;
      display: grid; place-items: center; pointer-events: none;
      font: inherit; font-size: clamp(2rem, 10.5vw, 5rem); font-weight: 800;
      line-height: 1; z-index: 2;
    }
    #countdown[hidden] { display: none; }
    .shuffle-mark { position: absolute; left: 50%; top: 50%; width: 48%; height: 48%; transform: translate(-50%, -50%); opacity: .72; -webkit-transform-origin: 50% 50%; transform-origin: 50% 50%; }
    .shuffle-mark.orbiting-dot { border: 2px solid currentColor; border-radius: 50%; }
    .shuffle-mark.orbiting-dot::after { content: ""; position: absolute; left: 50%; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: currentColor; transform: translateX(-50%); }
    .shuffle-mark.compass-star::before { content: ""; position: absolute; inset: 10%; background: currentColor; clip-path: polygon(50% 0, 61% 38%, 100% 50%, 61% 62%, 50% 100%, 39% 62%, 0 50%, 39% 38%); }
    .shuffle-mark.nested-diamonds::before, .shuffle-mark.nested-diamonds::after { content: ""; position: absolute; left: 50%; top: 50%; border: 2px solid currentColor; transform: translate(-50%, -50%) rotate(45deg); }
    .shuffle-mark.nested-diamonds::before { width: 70%; height: 70%; }
    .shuffle-mark.nested-diamonds::after { width: 34%; height: 34%; }
    #board.shuffling .shuffle-mark { -webkit-animation: shuffle-spin 900ms linear infinite; animation: shuffle-spin 900ms linear infinite; -webkit-animation-delay: var(--delay); animation-delay: var(--delay); }
    #board.shuffling .shuffle-mark.spin-reverse { -webkit-animation-name: shuffle-spin-reverse; animation-name: shuffle-spin-reverse; }
    @keyframes shuffle-spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @-webkit-keyframes shuffle-spin {
      to { -webkit-transform: translate(-50%, -50%) rotate(360deg); transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes shuffle-spin-reverse {
      to { transform: translate(-50%, -50%) rotate(-360deg); }
    }
    @-webkit-keyframes shuffle-spin-reverse {
      to { -webkit-transform: translate(-50%, -50%) rotate(-360deg); transform: translate(-50%, -50%) rotate(-360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #board.shuffling .shuffle-mark { -webkit-animation: none; animation: none; }
      .tile { transition: none; }
    }
</style>
</head>
<body>
  <main>
    <header>
      <div class="brand" aria-label="Five squared">Five²</div>
      <div class="timer-wrap">
        <div id="status" aria-live="polite">Ready</div>
        <div id="timer" aria-live="off">3:00</div>
      </div>
      <div class="header-tools">
        <button id="board-size" class="secondary" type="button" aria-controls="board" aria-label="Expand board" aria-pressed="false"><span aria-hidden="true"><svg viewBox="0 0 48 48" focusable="false"><path d="M8 18V8h10M8 8l14 14M30 40h10V30M40 40L26 26"/></svg></span></button>
      </div>
    </header>

    <div class="board-wrap" id="board-wrap">
      <section id="board" aria-label="Five by five letter board"><div id="countdown" hidden aria-hidden="true"></div></section>
    </div>

    <div class="controls" aria-label="Game controls">
      <button id="start" class="primary" type="button">Start</button>
      <button id="pause" class="secondary" type="button" disabled>Pause</button>
    </div>

    <div class="note">3-minute rounds · works offline after first load</div>
    <div class="note build-stamp">Build: v16 · Sep 20, 2026</div>
  </main>

  <script>
    (() => {
      'use strict';

      // 25 six-sided dice using a classic 5×5 letter-cube distribution.
      const DICE = [
        'AAAFRS','AAEEEE','AAFIRS','ADENNN','AEEEEM',
        'AEEGMU','AEGMNN','AFIRSY','BJKQXZ','CCNSTW',
        'CEIILT','CEILPT','CEIPST','DDLNOR','DHHLOR',
        'DHHNOT','DHLNOR','EIIITT','EMOTTT','ENSSSU',
        'FIPRSY','GORRVW','HIPRRY','NOOTUW','OOOTTU'
      ];

      const ROUND_MS = 3 * 60 * 1000;
      const boardEl = document.getElementById('board');
      const mainEl = document.querySelector('main');
      const timerEl = document.getElementById('timer');
      const statusEl = document.getElementById('status');
      const startBtn = document.getElementById('start');
      const pauseBtn = document.getElementById('pause');
      const countdownEl = document.getElementById('countdown');
      const boardWrap = document.getElementById('board-wrap');
      const sizeBtn = document.getElementById('board-size');
      const wideScreen = window.matchMedia('(min-width: 600px)');
      let expandedOverride = null;
      let shuffleDeadline = 0;

      let state = 'ready'; // ready | shuffling | running | paused | ended
      let remainingMs = ROUND_MS;
      let deadline = 0;
      let ticker = null;
      let audioContext = null;

      function randomInt(maxExclusive) {
        if (!Number.isInteger(maxExclusive) || maxExclusive <= 0) {
          throw new RangeError('maxExclusive must be a positive integer');
        }

        if (window.crypto && window.crypto.getRandomValues) {
          const range = 0x100000000;
          const limit = range - (range % maxExclusive);
          const sample = new Uint32Array(1);
          let value;
          do {
            window.crypto.getRandomValues(sample);
            value = sample[0];
          } while (value >= limit);
          return value % maxExclusive;
        }

        return Math.floor(Math.random() * maxExclusive);
      }

      function shuffle(array) {
        const result = array.slice();
        for (let i = result.length - 1; i > 0; i--) {
          const j = randomInt(i + 1);
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }

      function rollDice() {
        return shuffle(DICE.map(die => die[randomInt(die.length)]));
      }

      function drawBoard(blank = false) {
        boardEl.replaceChildren();
        const letters = blank ? Array(25).fill('') : rollDice();
        for (let index = 0; index < letters.length; index += 1) {
          const letter = letters[index];
          const tile = document.createElement('div');
          tile.className = 'tile' + (letter === 'Q' ? ' qu' : '');
          tile.setAttribute('aria-label', letter === 'Q' ? 'Q U' : letter);
          if (blank) tile.setAttribute('aria-hidden', 'true');
          tile.style.setProperty('--delay', `${-randomInt(280)}ms`);

          const letterEl = document.createElement('span');
          letterEl.className = 'tile-letter';
          letterEl.textContent = letter === 'Q' ? 'Qu' : letter;

          const rotation = randomInt(4) * 90;
          letterEl.style.setProperty('--rotation', `${rotation}deg`);

          tile.appendChild(letterEl);
          if (blank && index !== 12) {
            const mark = document.createElement('span');
            const symbols = ['compass-star', 'nested-diamonds', 'orbiting-dot'];
            const direction = randomInt(2) ? '' : ' spin-reverse';
            mark.className = `shuffle-mark ${symbols[randomInt(symbols.length)]}${direction}`;
            mark.setAttribute('aria-hidden', 'true');
            tile.appendChild(mark);
          }
          boardEl.appendChild(tile);
        }
        boardEl.appendChild(countdownEl);
      }

      function formatTime(ms) {
        const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${minutes}:${String(seconds).padStart(2, '0')}`;
      }

      function render() {
        timerEl.textContent = formatTime(remainingMs);
        boardEl.classList.toggle('ended', state === 'ended');
        statusEl.classList.toggle('time-up', state === 'ended');
        boardEl.classList.toggle('shuffling', state === 'shuffling');
        countdownEl.hidden = state !== 'shuffling';
        pauseBtn.textContent = state === 'paused' ? 'Resume' : 'Pause';

        switch (state) {
          case 'ready':
            statusEl.textContent = 'Ready';
            startBtn.textContent = 'Start';
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            break;
          case 'running':
            statusEl.textContent = 'Playing';
            startBtn.textContent = 'Cancel';
            startBtn.disabled = false;
            pauseBtn.disabled = false;
            break;
          case 'shuffling':
            statusEl.textContent = `Shuffling… ${countdownEl.textContent}`;
            startBtn.textContent = 'Cancel';
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            break;
          case 'paused':
            statusEl.textContent = 'Paused';
            startBtn.textContent = 'Cancel';
            startBtn.disabled = false;
            pauseBtn.disabled = false;
            break;
          case 'ended':
            statusEl.textContent = 'Time!';
            startBtn.textContent = 'Start';
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            break;
        }
      }

      function clearTicker() {
        if (ticker !== null) {
          clearInterval(ticker);
          ticker = null;
        }
      }

      function tick() {
        if (state !== 'running') return;
        remainingMs = Math.max(0, deadline - performance.now());
        if (remainingMs <= 0) {
          endRound();
          return;
        }
        render();
      }

      function ensureAudio() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!audioContext) audioContext = new AudioCtx();
        if (audioContext.state === 'suspended') {
          audioContext.resume().catch(() => {});
        }
      }

      function dingAt(offsetSeconds) {
        if (!audioContext || audioContext.state !== 'running') return;
        const start = audioContext.currentTime + offsetSeconds;
        // Identical bell strikes: a clear fundamental and softly decaying partials.
        for (const [ratio, volume, decay] of [[1, .22, 1.1], [2, .065, .7], [2.76, .025, .45]]) {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880 * ratio, start);
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(volume, start + .006);
          gain.gain.exponentialRampToValueAtTime(.0001, start + decay);
          gain.gain.linearRampToValueAtTime(0, start + decay + .02);
          osc.connect(gain);
          gain.connect(audioContext.destination);
          osc.onended = () => { osc.disconnect(); gain.disconnect(); };
          osc.start(start);
          osc.stop(start + decay + .03);
        }
      }

      function playEndSignal() {
        try { ensureAudio(); [0, .45, .90].forEach(dingAt); }
        catch (_) { /* The visual alert remains available without audio. */ }
      }

      function shuffleTick() {
        if (state !== 'shuffling') return;
        const left = shuffleDeadline - performance.now();
        if (left > 0) {
          countdownEl.textContent = String(Math.ceil(left / 1000));
          render();
          return;
        }
        clearTicker();
        drawBoard();
        remainingMs = ROUND_MS;
        deadline = performance.now() + ROUND_MS;
        state = 'running';
        ticker = setInterval(tick, 100);
        tick();
      }

      function startRound() {
        if (state !== 'ready' && state !== 'ended') return;
        try { ensureAudio(); } catch (_) { /* Audio is optional. */ }
        clearTicker();
        state = 'shuffling';
        remainingMs = ROUND_MS;
        drawBoard(true);
        shuffleDeadline = performance.now() + 3000;
        shuffleTick();
        ticker = setInterval(shuffleTick, 50);
      }

      function cancelRound() {
        if (state !== 'shuffling' && state !== 'running' && state !== 'paused') return;
        clearTicker();
        remainingMs = ROUND_MS;
        state = 'ready';
        drawBoard(true);
        render();
      }

      function handleStartClick() {
        if (state === 'shuffling' || state === 'running' || state === 'paused') {
          cancelRound();
          return;
        }
        startRound();
      }

      function pauseRound() {
        if (state === 'paused') {
          try { ensureAudio(); } catch (_) {}
          deadline = performance.now() + remainingMs;
          state = 'running';
          ticker = setInterval(tick, 100);
          tick();
          return;
        }
        if (state !== 'running') return;
        remainingMs = Math.max(0, deadline - performance.now());
        if (remainingMs <= 0) { endRound(); return; }
        clearTicker();
        state = 'paused';
        render();
      }

      function endRound() {
        clearTicker();
        remainingMs = 0;
        state = 'ended';
        playEndSignal();
        render();
      }

      function renderSize() {
        const expanded = expandedOverride ?? !wideScreen.matches;
        if (expandedOverride !== null) boardWrap.dataset.expanded = String(expanded);
        mainEl.dataset.expanded = String(expanded);
        sizeBtn.setAttribute('aria-label', expanded ? 'Reduce board' : 'Expand board');
        sizeBtn.title = expanded ? 'Reduce board' : 'Expand board';
        sizeBtn.setAttribute('aria-pressed', String(expanded));
        sizeBtn.firstElementChild.innerHTML = expanded
          ? '<svg viewBox="0 0 48 48" focusable="false"><path d="M7 7L21 21M41 41L27 27"/><path fill="currentColor" d="M22 22L14 20L20 14Z M26 26L34 28L28 34Z"/></svg>'
          : '<svg viewBox="0 0 48 48" focusable="false"><path d="M8 18V8h10M8 8l14 14M30 40h10V30M40 40L26 26"/></svg>';
      }
      sizeBtn.addEventListener('click', () => {
        expandedOverride = !(expandedOverride ?? !wideScreen.matches);
        renderSize();
      });
      wideScreen.addEventListener('change', renderSize);
      renderSize();

      startBtn.addEventListener('click', handleStartClick);
      pauseBtn.addEventListener('click', pauseRound);

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return;
        if (state === 'running') tick();
        if (state === 'shuffling') shuffleTick();
      });

      drawBoard(true);
      render();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' }).catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
